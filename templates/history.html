<!DOCTYPE html>
<html>

<head>

    <title>History</title>

    <style>

        body {
            font-family: Arial;
            background-color: #f4f4f4;
            text-align: center;
            padding-top: 40px;
        }

        .container {
            width: 80%;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.2);
        }

        h1 {
            margin-bottom: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background-color: #333;
            color: white;
            padding: 12px;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        .alarm {
            color: red;
            font-weight: bold;
        }

        .ok {
            color: green;
            font-weight: bold;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>🍺 Historique des Données</h1>

        <table>

            <tr>
                <th>ID</th>
                <th>Temperature</th>
                <th>Phase</th>
                <th>Alarm</th>
            </tr>

            {% for row in rows %}

            <tr>

                <td>{{ row[0] }}</td>

                <td>{{ row[1] }} °C</td>

                <td>{{ row[2] }}</td>

                <td>
                    {% if row[3] %}
                        <span class="alarm">⚠️ ALARM</span>
                    {% else %}
                        <span class="ok">✅ OK</span>
                    {% endif %}
                </td>

            </tr>

            {% endfor %}

        </table>

    </div>

</body>
</html>
