<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Brauanlage Live-Anzeige</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      padding: 30px;
    }

    .card {
      background: #1f2937;
      padding: 20px;
      margin: 15px 0;
      border-radius: 12px;
    }

    .ok {
      color: #22c55e;
    }

    .alarm {
      color: #ef4444;
    }
  </style>
</head>
<body>

  <h1>Digitaler Zwilling – Brauanlage</h1>

  <div class="card">
    <h2>Status: <span id="connection">---</span></h2>
    <p>Zeit: <span id="timestamp">---</span></p>
    <p>Prozessphase: <span id="phase">---</span></p>
    <p>Temperatur: <span id="temperature">---</span> °C</p>
    <p>Pumpe 1: <span id="pump">---</span></p>
    <p>Ventil 1: <span id="valve">---</span></p>
    <p>Alarm: <span id="alarm">---</span></p>
  </div>

  <script>
    async function loadStatus() {
      try {
        const response = await fetch("/api/status");
        const data = await response.json();

        document.getElementById("timestamp").textContent = data.timestamp;
        document.getElementById("connection").textContent = data.connection_status;
        document.getElementById("phase").textContent = data.process_phase;
        document.getElementById("temperature").textContent = data.temperature;
        document.getElementById("pump").textContent = data.pump_1 ? "Ein" : "Aus";
        document.getElementById("valve").textContent = data.valve_1 ? "Offen" : "Geschlossen";

        const alarmElement = document.getElementById("alarm");
        alarmElement.textContent = data.alarm ? "Alarm" : "OK";
        alarmElement.className = data.alarm ? "alarm" : "ok";

      } catch (error) {
        document.getElementById("connection").textContent = "offline";
        document.getElementById("connection").className = "alarm";
      }
    }

    loadStatus();
    setInterval(loadStatus, 2000);
  </script>

</body>
</html>
